<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Böcker</title>
    <style>
      body {
        text-align: center;
      }
      h1 {
        font-family: sans-serif;
        font-size: 22px;
        letter-spacing: 1px;
        color: rgb(51, 104, 91);
        margin-bottom: 1.5rem;
      }
      a {
        font-family: sans-serif;
        color: rgb(51, 104, 91);
        display: inline-block;
        margin-top: 1.5rem;
      }
      a:hover {
        color: rgb(30, 70, 60);
      }
      form{
        display: inline-block;
        margin: 0.8rem;
      }
      tbody {
        background-color: #e4f5ed;
      }
      table {
        border-collapse: collapse;
        border: 4px solid rgb(51, 104, 91);
        font-family: sans-serif;
        font-size: 0.8rem;
        letter-spacing: 1px;
        margin: 0 auto;
        width: 40%;
      }

      caption {
        caption-side: bottom;
        padding: 10px;
      }

      th,
      td {
        border: 1px solid rgb(160 160 160);
        padding: 8px 10px;
      }

      td {
        text-align: center;
      }
    </style>
  </head>

  <body>
    <h1>Filtrera böcker</h1>

    <form th:action="@{/genre}" method="get">
      <select name="type">
        <option value="">Välj genre:</option>
        <option value="comedy">Komedi</option>
        <option value="fantasy">Fantasy</option>
        <option value="action">Action</option>
        <option value="drama">Drama</option>
        <option value="dystopian">Dystopier</option>
      </select>
      <button type="submit">Visa</button>
    </form>

    <div th:if="${!#lists.isEmpty(books)}">
      <table>
        <thead>
          <tr>
            <th>Titel</th>
            <th>Författare</th>
            <th>Genre</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="book : ${books}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.genre}"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div th:if="${#lists.isEmpty(books)}">
      <p>Tyvärr finns inga böcker i denna genren.</p>
    </div>

    <a th:href="@{/home}">Tillbaka till startsidan</a>
  </body>
</html>
